services:
  # Backend Web Service
  - type: web
    name: smart-samarpan-academy-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: smart-samarpan-academy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER
        value: https://smart-samarpan-academy-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1062715092783-h79kkhe4rdce6cg2qcoduqir56gktin2.apps.googleusercontent.com
      - key: VITE_RAZORPAY_KEY
        value: rzp_test_hu4uSc3Jfsnnnj

